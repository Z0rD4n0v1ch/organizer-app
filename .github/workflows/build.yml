name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk organizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: organizer-apk
          path: organizer.apk

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest organizer.apk \
            --title "Органайзер, сборка ${{ github.run_number }}" \
            --notes "Скачайте organizer.apk на телефон и установите."
