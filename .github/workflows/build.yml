name: Сборка APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'catalogs/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk organizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: organizer-apk
          path: organizer.apk

      - name: Описание изменений
        if: github.ref == 'refs/heads/main'
        run: |
          N=${{ github.run_number }}
          PREV=$(git tag --list 'v1.*' --sort=-v:refname | head -n1)
          {
            echo "## Что нового"
            echo
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-n 15"; fi
            git log $RANGE --no-merges --pretty='- %s' | grep -v -e '^- Create build.yml' -e '^- Merge' || echo "- Технические изменения"
            echo
            echo "## Установка"
            echo
            echo "Скачайте **organizer.apk** ниже и откройте на телефоне. Если органайзер уже установлен, он предложит обновиться сам, данные сохранятся."
            echo
            if [ -n "$PREV" ]; then echo "Изменения с версии ${PREV#v}. Полная история — [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) и предыдущие релизы."; else echo "История до этой версии — [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."; fi
          } > notes.md
          cat notes.md

      - name: Опубликовать релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          # прежний единственный релиз «latest» больше не нужен: теперь у каждой сборки свой релиз
          gh release delete latest -y --cleanup-tag || true
          gh release create "v1.$N" organizer.apk \
            --target "$GITHUB_SHA" \
            --title "Органайзер 1.$N, сборка $N" \
            --notes-file notes.md \
            --latest
