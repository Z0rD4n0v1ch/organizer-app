name: Веб-версия (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт
        run: |
          mkdir site
          cp -r app/src/main/assets/. site/
          cp web/manifest.webmanifest web/sw.js web/*.png site/
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/" site/sw.js
          touch site/.nojekyll

      - name: Опубликовать в ветку gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Веб-версия ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
